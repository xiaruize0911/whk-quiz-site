<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />
    <title>高三期中刷题本</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="刷题本" />
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem("g3-drill-theme") || "{}");
        if (theme.palette) document.documentElement.dataset.palette = theme.palette;
        if (theme.mode) document.documentElement.dataset.mode = theme.mode;
      } catch (error) {}
    </script>
    <link rel="stylesheet" href="./styles.css?v=20261104g" />
    <script>
      window.MathJax = {
        loader: { load: ["[tex]/mathtools"] },
        tex: {
          inlineMath: [["\\(", "\\)"]],
          displayMath: [["\\[", "\\]"]],
          packages: { "[+]": ["mathtools"] },
          // Structural and electron formulas in the chemistry analyses.
          macros: {
            chemud: ["\\mathord{\\overset{\\displaystyle #1\\atop\\displaystyle|}{\\underset{\\displaystyle|\\atop\\displaystyle #3}{#2}}}", 3],
            chemup: ["\\mathord{\\overset{\\displaystyle\\mathclap{#1}\\atop\\displaystyle|}{#2}}", 2],
            chemdown: ["\\mathord{\\underset{\\displaystyle|\\atop\\displaystyle\\mathclap{#2}}{#1}}", 2],
            chemdup: ["\\mathord{\\overset{\\displaystyle #1\\atop\\displaystyle\\Vert}{#2}}", 2],
            chemleft: ["\\mathord{\\begin{matrix}\\mathrm{#1}\\diagdown\\\\[-4pt]\\mathrm{#2}\\diagup\\end{matrix}}\\!", 2],
            chemright: ["\\!\\mathord{\\begin{matrix}\\diagup\\mathrm{#1}\\\\[-4pt]\\diagdown\\mathrm{#2}\\end{matrix}}", 2],
            lonepair: ["\\mathord{\\overset{..}{\\underset{..}{#1}}}", 1],
            pairud: ["\\mathord{\\overset{\\displaystyle #1\\atop\\displaystyle\\cdot\\!\\cdot}{\\underset{\\displaystyle\\cdot\\!\\cdot\\atop\\displaystyle #3}{#2}}}", 3],
          },
        },
        options: { enableMenu: false },
        chtml: { matchFontHeight: false },
        startup: {
          typeset: false,
          pageReady() {
            return MathJax.startup.defaultPageReady().then(() => window.onMathJaxReady?.());
          },
        },
      };
    </script>
    <script defer src="./vendor/mathjax/tex-chtml.js?v=3.2.2"></script>
  </head>
  <body>
    <header class="mobile-bar">
      <strong class="mobile-brand">高三期中刷题本</strong>
      <select id="mobile-subject-select" class="mobile-subject-select" aria-label="切换学科"></select>
      <button id="sidebar-open-btn" class="ghost-btn mobile-menu-btn" aria-controls="sidebar" aria-expanded="false">筛选</button>
    </header>
    <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>
    <div class="page-shell">
      <aside id="sidebar" class="sidebar">
        <button id="sidebar-close-btn" class="sidebar-close-btn" aria-label="关闭菜单">×</button>
        <div class="brand">
          <p class="eyebrow">G3 Midterm Drill</p>
          <h1>高三期中刷题本</h1>
        </div>

        <section class="sidebar-section">
          <h2>学科</h2>
          <div id="subject-tabs" class="subject-tabs"></div>
        </section>

        <section class="sidebar-section">
          <h2>考点</h2>
          <select id="topic-select" class="topic-select" aria-label="选择考点"></select>
        </section>

        <section class="sidebar-section">
          <h2>范围</h2>
          <div class="mode-stack segmented">
            <button class="mode-btn scope-btn active" data-scope="all">全部题</button>
            <button class="mode-btn scope-btn" data-scope="choice">仅选择题</button>
            <button class="mode-btn scope-btn" data-scope="wrong">只刷错题</button>
            <button class="mode-btn scope-btn" data-scope="due">今日待复习</button>
          </div>
        </section>

        <section class="sidebar-section">
          <h2>顺序</h2>
          <div class="mode-stack segmented">
            <button class="mode-btn order-btn active" data-order="random">随机</button>
            <button class="mode-btn order-btn" data-order="sprint" title="最容易忘的题先出：到期复习 → 新题 → 未到期；已背牢最后">冲刺</button>
            <button class="mode-btn order-btn" data-order="wrong-priority">错题优先</button>
            <button class="mode-btn order-btn" data-order="shuffled">乱序不重复</button>
            <button class="mode-btn order-btn" data-order="sequential">顺序</button>
          </div>
        </section>
      </aside>

      <main class="main-panel">
        <header class="app-bar">
          <nav class="view-switch" aria-label="页面切换">
            <button id="practice-view-btn" class="view-btn active">刷题</button>
            <button id="ledger-view-btn" class="view-btn">进度</button>
            <button id="wrongbook-view-btn" class="view-btn">错题本<span id="wrongbook-count" class="view-count hidden"></span></button>
            <button id="answer-review-view-btn" class="view-btn">背答案</button>
          </nav>
          <button id="progress-pill" class="progress-pill" title="查看进度">
            <span class="progress-pill-text"></span>
            <span class="stage-bar"></span>
          </button>
          <div class="app-bar-actions">
            <div class="question-actions" aria-label="题目操作">
              <button id="prev-btn" class="ghost-btn">上一题</button>
              <button id="next-btn" class="ghost-btn">下一题</button>
              <button id="reveal-btn" class="primary-btn">显示答案</button>
            </div>
            <button id="settings-open-btn" class="icon-btn" aria-label="设置与配色" title="设置与配色">
              <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 5h8M15 5h2M3 10h2M9 10h8M3 15h10"/><circle cx="13" cy="5" r="2"/><circle cx="7" cy="10" r="2"/><circle cx="15" cy="15" r="2"/></svg>
            </button>
          </div>
        </header>

        <section id="practice-view" class="question-card">
          <div class="question-head">
            <p id="question-meta" class="eyebrow">等待载入</p>
            <h2 id="question-title">正在准备题库</h2>
            <div class="question-section-row">
              <div id="question-section" class="question-section"></div>
              <span id="question-stage" class="question-stage"></span>
              <button id="keyboard-help-toggle" class="ghost-btn keyboard-help-toggle" aria-controls="keyboard-help" aria-expanded="false">⌨ 快捷键</button>
            </div>
          </div>
          <div id="material-content" class="material-box hidden"></div>
          <div class="question-main">
          <div id="keyboard-help" class="keyboard-help hidden" aria-label="键盘快捷键说明"></div>
          <div id="prompt-content" class="rich-block prompt-block"></div>

          <div id="choice-wrapper" class="choice-wrapper hidden">
            <div id="options-raw" class="option-list" role="group" aria-label="选项"></div>
          </div>

          <div id="input-wrapper" class="input-wrapper hidden">
            <label class="input-label" for="subjective-input">作答区</label>
            <textarea id="subjective-input" class="subjective-input" placeholder="在这里输入答案，显示答案后自行对照批改。"></textarea>
          </div>

          <div id="feedback-box" class="feedback-box hidden"></div>
          <div id="answer-content" class="answer-panel hidden"></div>

          <div id="subjective-actions" class="subjective-actions hidden">
            <span class="self-grade-hint">对照答案自评</span>
            <button id="mark-correct-btn" class="success-btn">全对</button>
            <button id="mark-partial-btn" class="partial-btn">部分对</button>
            <button id="mark-wrong-btn" class="danger-btn">不会</button>
          </div>
          </div>
        </section>

        <section id="ledger-view" class="ledger-panel hidden">
          <div id="progress-overview" class="progress-overview"></div>
          <div class="ledger-head">
            <div>
              <p class="eyebrow">当前学科</p>
              <h2 id="ledger-subject-title">掌握情况</h2>
            </div>
            <div id="ledger-summary" class="ledger-summary"></div>
          </div>
          <div id="topic-mastery" class="topic-mastery"></div>
          <div class="mastery-head ledger-list-head">
            <h3>逐题记录</h3>
          </div>
          <div id="question-ledger" class="question-ledger"></div>
        </section>

        <section id="wrongbook-view" class="ledger-panel wrongbook-panel hidden">
          <div class="ledger-head">
            <div>
              <p class="eyebrow">当前学科</p>
              <h2 id="wrongbook-subject-title">错题本</h2>
            </div>
            <div class="wrongbook-head-actions">
              <button id="drill-wrong-btn" class="primary-btn">只刷错题</button>
              <button id="clear-wrongbook" class="ghost-btn">清空</button>
            </div>
          </div>
          <div id="wrongbook-list" class="wrongbook-list"></div>
        </section>

        <section id="answer-review-view" class="answer-review-panel hidden">
          <div class="ledger-head">
            <div>
              <p class="eyebrow">Answer Review</p>
              <h2>高频背答案</h2>
            </div>
            <div class="answer-review-actions">
              <div id="answer-review-summary" class="ledger-summary"></div>
              <button id="copy-answer-review-btn" class="primary-btn">复制当前列表答案</button>
            </div>
          </div>
          <div class="answer-review-tools">
            <input id="answer-review-search" class="answer-review-search" type="search" placeholder="搜索题干、选项或答案关键词" aria-label="搜索背答案列表" />
            <button id="answer-review-cover-btn" class="ghost-btn">遮住答案自测</button>
          </div>
          <p class="muted answer-review-hint">按侧栏「考点」筛选；遮住模式下点击答案区域即可揭晓。</p>
          <div id="answer-review-copy-status" class="muted answer-review-copy-status"></div>
          <textarea id="answer-review-plain-text" class="answer-review-plain-text" readonly aria-label="当前学科纯文本答案"></textarea>
          <div id="answer-review-list" class="answer-review-list"></div>
        </section>
      </main>
    </div>

    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
      <form method="dialog" class="settings-head">
        <h2 id="settings-title">设置</h2>
        <button class="icon-btn" aria-label="关闭设置">×</button>
      </form>
      <section class="settings-section">
        <h3>配色方案</h3>
        <div id="palette-options" class="palette-options"></div>
      </section>
      <section class="settings-section">
        <h3>明暗</h3>
        <div id="mode-options" class="mode-stack segmented mode-options"></div>
      </section>
      <section class="settings-section">
        <h3>数据备份</h3>
        <p class="muted backup-hint">进度只保存在当前浏览器。换设备或清理浏览器前先导出。</p>
        <div class="backup-actions">
          <button id="export-progress-btn" class="ghost-btn">导出进度</button>
          <button id="import-progress-btn" class="ghost-btn">导入进度</button>
        </div>
        <input id="import-progress-input" type="file" accept="application/json,.json" hidden />
        <p id="backup-status" class="muted backup-status"></p>
      </section>
      <section class="settings-section">
        <h3>重置</h3>
        <button id="reset-subject-stats" class="danger-btn">清空当前学科的做题记录</button>
      </section>
    </dialog>

    <div id="image-zoom" class="image-zoom hidden" role="dialog" aria-modal="true" aria-label="图片预览">
      <button id="image-zoom-close" class="image-zoom-close" aria-label="关闭图片预览">×</button>
      <img id="image-zoom-img" alt="" />
    </div>

    <script src="./data/questions.js?v=20261107a"></script>
    <script src="./app.js?v=20261104g"></script>
  </body>
</html>
